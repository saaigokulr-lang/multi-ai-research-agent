services:
  app:
    build: .
    ports:
      - "8000:8000"
    # DATABASE_URL/REDIS_URL/OPENROUTER_API_KEY/TAVILY_API_KEY/GROQ_API_KEY are
    # read from the local .env at container start -- not baked into the image.
    # No postgres/redis services here: both are hosted externally (Supabase /
    # Upstash) and the app connects out to them exactly as it does outside Docker.
    env_file:
      - .env
    healthcheck:
      # Uses the stdlib rather than curl/wget, neither of which is installed
      # in the slim base image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      # "app" here is the other service's name -- Compose's built-in DNS
      # resolves it to that container on the shared compose network, unlike
      # localhost, which inside this container would mean itself.
      API_BASE_URL: http://app:8000
    depends_on:
      # Only orders container start, not API readiness -- streamlit_app.py
      # retries its first request a few times to absorb the gap while
      # uvicorn is still starting up inside the app container.
      - app
